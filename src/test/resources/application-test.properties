services.user.url=http://localhost:8081
services.auth.url=http://localhost:8082
spring.datasource.url=http://localhost:8083

spring.jpa.show-sql=true

spring.cloud.openfeign.circuitbreaker.enabled=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.innowise.orderservice.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.innowise.orderservice.kafka.PaymentEvent

internal.secret=super-secret-internal
internal.secret.header=X-Internal-Secret