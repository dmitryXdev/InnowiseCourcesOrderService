services:
  order-service:
    build: .
    container_name: order-service-container
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order-service-db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVICES_AUTH_URL=http://auth-service:8080
      - SERVICES_USER_URL=http://user-service:8081
    depends_on:
      - postgres
    networks:
      - java-network
  postgres:
    image: postgres:16-alpine
    container_name: order-service-db
    environment:
      POSTGRES_DB: order-service-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pg_order_data:/var/lib/postgresql/data
    networks:
      - java-network
    restart: always

volumes:
  pg_order_data:

networks:
  java-network:
    name: java-network
    driver: bridge

